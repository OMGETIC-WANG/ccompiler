TranslationUnit:
  decls:
    - VarDecl: {name: lhs}
    - VarDecl: {name: rhs}
    - VarDecl: {name: values}
    - VarDecl:
        name: assign_expr
        initializer:
          ValueInitializer:
            value:
              BinaryExpr:
                op_type: Assignment
                left: {VarRef: {name: lhs}}
                right: {VarRef: {name: rhs}}
    - VarDecl:
        name: add_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Add}}
    - VarDecl:
        name: sub_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Sub}}
    - VarDecl:
        name: mul_expr
        initializer:
          ValueInitializer:
            value:
              BinaryExpr:
                op_type: Mul
                left: {VarRef: {name: lhs}}
                right: {VarRef: {name: rhs}}
    - VarDecl:
        name: div_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Div}}
    - VarDecl:
        name: mod_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Mod}}
    - VarDecl:
        name: eq_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Eq}}
    - VarDecl:
        name: ne_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Ne}}
    - VarDecl:
        name: lt_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Lt}}
    - VarDecl:
        name: gt_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Gt}}
    - VarDecl:
        name: le_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Le}}
    - VarDecl:
        name: ge_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Ge}}
    - VarDecl:
        name: bitand_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: BitAnd}}
    - VarDecl:
        name: bitor_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: BitOr}}
    - VarDecl:
        name: bitxor_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: BitXor}}
    - VarDecl:
        name: lshift_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: LShift}}
    - VarDecl:
        name: rshift_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: RShift}}
    - VarDecl:
        name: add_assign_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Assignment, compound_op: Add}}
    - VarDecl:
        name: sub_assign_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Assignment, compound_op: Sub}}
    - VarDecl:
        name: mul_assign_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Assignment, compound_op: Mul}}
    - VarDecl:
        name: div_assign_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Assignment, compound_op: Div}}
    - VarDecl:
        name: mod_assign_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Assignment, compound_op: Mod}}
    - VarDecl:
        name: bitand_assign_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Assignment, compound_op: BitAnd}}
    - VarDecl:
        name: bitor_assign_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Assignment, compound_op: BitOr}}
    - VarDecl:
        name: bitxor_assign_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Assignment, compound_op: BitXor}}
    - VarDecl:
        name: lshift_assign_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Assignment, compound_op: LShift}}
    - VarDecl:
        name: rshift_assign_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Assignment, compound_op: RShift}}
    - VarDecl:
        name: subscript_expr
        initializer:
          ValueInitializer:
            value:
              BinaryExpr:
                op_type: Subscript
                left: {VarRef: {name: values}}
                right: {LiteralNum: {value: 0}}
    - VarDecl:
        name: and_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: And}}
    - VarDecl:
        name: or_expr
        initializer:
          ValueInitializer:
            value: {BinaryExpr: {op_type: Or}}
