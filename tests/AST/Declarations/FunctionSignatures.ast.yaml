TranslationUnit:
  decls:
    - FunctionDecl:
        name: no_args
        function_type:
          FunctionType:
            return_type: {BuiltinType: {type_name: int}}
            parameters: []
        parameter_names: []
    - FunctionDecl:
        name: named
        function_type:
          FunctionType:
            return_type: {BuiltinType: {type_name: int}}
            parameters:
              - {BuiltinType: {type_name: int}}
              - PointerType:
                  pointee_type:
                    PointerType:
                      pointee_type: {BuiltinType: {type_name: char}}
        parameter_names: [left, argv]
    - FunctionDecl:
        name: returns_pointer
        function_type:
          FunctionType:
            return_type:
              PointerType:
                pointee_type: {BuiltinType: {type_name: int}}
            parameters:
              - {BuiltinType: {type_name: double}}
        parameter_names: [value]
    - FunctionDecl:
        name: f
        function_type:
          FunctionType:
            return_type: {BuiltinType: {type_name: int}}
            parameters:
              - ArrayType:
                  size: 10
                  element_type: {BuiltinType: {type_name: int}}
        parameter_names: [<anonymous>]
    - FunctionDecl:
        name: g
        function_type:
          FunctionType:
            return_type: {BuiltinType: {type_name: int}}
            parameters:
              - ArrayType:
                  size: null
                  element_type: {BuiltinType: {type_name: int}}
              - ArrayType:
                  size: 2
                  element_type:
                    ArrayType:
                      size: 3
                      element_type: {BuiltinType: {type_name: int}}
              - ArrayType:
                  size: 4
                  element_type:
                    PointerType:
                      pointee_type: {BuiltinType: {type_name: int}}
              - ArrayType:
                  size: 5
                  element_type: {BuiltinType: {type_name: int}}
        parameter_names:
          [<anonymous>, <anonymous>, <anonymous>, <anonymous>]
