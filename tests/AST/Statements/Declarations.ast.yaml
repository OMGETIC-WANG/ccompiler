TranslationUnit:
  decls:
    - FunctionDecl:
        name: declarations
        body:
          CompoundStmt:
            statements:
              - VarDecl:
                  name: a
                  initializer:
                    ValueInitializer:
                      value: {LiteralNum: {value: 1}}
              - DeclStmt:
                  decls:
                    - VarDecl: {name: b}
                    - VarDecl:
                        name: c
                        initializer:
                          ValueInitializer:
                            value: {LiteralNum: {value: 2}}
              - DeclStmt:
                  decls:
                    - VarDecl:
                        name: first
                        initializer:
                          ValueInitializer:
                            value: {LiteralNum: {value: 1}}
                    - VarDecl:
                        name: second
                        initializer:
                          ValueInitializer:
                            value:
                              BinaryExpr:
                                op_type: Add
                                left: {VarRef: {name: first}}
                                right: {LiteralNum: {value: 1}}
              - ReturnStmt:
                  ret_value:
                    BinaryExpr:
                      op_type: Add
                      left: {VarRef: {name: a}}
                      right: {VarRef: {name: c}}
